services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: wms
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/wms || true;
      exit 0;
      "

  api:
    build: ./backend
    environment: &backend-env
      ENV: development
      DATABASE_URL: postgresql+psycopg://wms:wms@postgres:5432/wms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-before-production-use-32-chars
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORAGE: redis://redis:6379/1
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: wms
      MINIO_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ./backend
    entrypoint: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: ./backend
    entrypoint: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_HINTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
